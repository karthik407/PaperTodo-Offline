name: UI performance audit (temporary)

on:
  push:
    branches:
      - fix/plugin-io-and-todo-visibility
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[perf-audit]')
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "true"
    steps:
      - name: Check out candidate
        uses: actions/checkout@v7
        with:
          path: candidate
          fetch-depth: 0
          submodules: recursive
      - name: Check out fixed main baseline
        uses: actions/checkout@v7
        with:
          ref: 9e176abfe33cbc0ca873c03576691b153f1299a0
          path: baseline
          fetch-depth: 0
          submodules: recursive
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Give baseline exactly the same audit harness
        run: |
          $ErrorActionPreference = 'Stop'
          Copy-Item candidate/tests/PaperTodo.PersistenceChecks/*.cs baseline/tests/PaperTodo.PersistenceChecks/ -Force
          Copy-Item candidate/tools/PaperTodo.DesktopBenchmarks/Program.cs baseline/tools/PaperTodo.DesktopBenchmarks/Program.cs -Force
          Copy-Item candidate/tools/PaperTodo.DesktopBenchmarks/TodoVisibilityAudit.cs baseline/tools/PaperTodo.DesktopBenchmarks/TodoVisibilityAudit.cs -Force
          New-Item -ItemType Directory -Path evidence -Force | Out-Null
      - name: Main plugin I/O contention
        run: |
          dotnet run --project baseline/tests/PaperTodo.PersistenceChecks/PaperTodo.PersistenceChecks.csproj -c Release -- --plugin-io-audit "$pwd/evidence/main-plugin-io.json"
          if ($LASTEXITCODE -ne 0) { throw 'Main plugin I/O audit failed' }
      - name: Candidate plugin I/O contention
        run: |
          dotnet run --project candidate/tests/PaperTodo.PersistenceChecks/PaperTodo.PersistenceChecks.csproj -c Release -- --plugin-io-audit "$pwd/evidence/candidate-plugin-io.json"
          if ($LASTEXITCODE -ne 0) { throw 'Candidate plugin I/O audit failed' }
      - name: Main Todo batch visibility
        run: |
          dotnet run --project baseline/tools/PaperTodo.DesktopBenchmarks/PaperTodo.DesktopBenchmarks.csproj -c Release -- --todo-visibility-audit "$pwd/evidence/main-todo-visibility.json"
          if ($LASTEXITCODE -ne 0) { throw 'Main Todo visibility audit failed' }
          Get-Content evidence/main-todo-visibility.json
      - name: Candidate Todo batch visibility
        run: |
          dotnet run --project candidate/tools/PaperTodo.DesktopBenchmarks/PaperTodo.DesktopBenchmarks.csproj -c Release -- --todo-visibility-audit "$pwd/evidence/candidate-todo-visibility.json"
          if ($LASTEXITCODE -ne 0) { throw 'Candidate Todo visibility audit failed' }
          Get-Content evidence/candidate-todo-visibility.json
      - name: Size-dependent material cost on main
        env:
          PAPER_BENCH_REVISION: 9e176abfe33cbc0ca873c03576691b153f1299a0
        run: |
          dotnet run --project baseline/tools/PaperTodo.MaterialBenchmarks/PaperTodo.MaterialBenchmarks.csproj -c Release -- --benchmark "$pwd/evidence/main-material-cost.json"
          if ($LASTEXITCODE -ne 0) { throw 'Existing material cost audit failed' }
          Get-Content evidence/main-material-cost.json
      - name: Candidate behavioral checks
        run: |
          dotnet run --project candidate/tests/PaperTodo.PersistenceChecks/PaperTodo.PersistenceChecks.csproj -c Release --no-build
          if ($LASTEXITCODE -ne 0) { throw 'Persistence checks failed' }
          dotnet run --project candidate/tests/PaperTodo.LifecycleChecks/PaperTodo.LifecycleChecks.csproj -c Release -- --case todo-visibility
          if ($LASTEXITCODE -ne 0) { throw 'Todo visibility behavior checks failed' }
      - name: Upload paired evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-performance-audit-${{ github.sha }}
          path: evidence
          if-no-files-found: warn
          retention-days: 14
